[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receipts"
version = "0.1.0"
description = "Prediction tracking and accountability system"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "click>=8.0",
    "apscheduler>=3.10,<4.0",
]

[project.scripts]
receipts = "receipts.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["receipts*"]

[tool.setuptools.package-data]
receipts = ["py.typed", "web/templates/*.html"]
