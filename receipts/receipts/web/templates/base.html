<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Receipts{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#6366f1', dark: '#4f46e5' }
          }
        }
      }
    }
  </script>
</head>
<body class="dark h-full text-gray-100 bg-gray-950 min-h-screen">

  <nav class="border-b border-gray-800 bg-gray-900">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
        <span class="text-2xl">&#x1F9FE;</span> Receipts
      </a>
      <div class="flex items-center gap-4 text-sm">
        <a href="/" class="text-gray-400 hover:text-white transition-colors">Leaderboard</a>
        <a href="/review" class="text-gray-400 hover:text-white transition-colors">Review Queue</a>
        <a href="/add-person" class="text-gray-400 hover:text-white transition-colors">+ Person</a>
        <a href="/add" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-medium transition-colors">
          + Prediction
        </a>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
