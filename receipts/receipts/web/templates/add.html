{% extends "base.html" %}
{% block title %}Add Prediction — Receipts{% endblock %}

{% block content %}

<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-white mb-6">Add a Prediction</h1>

  {% if error %}
  <div class="bg-red-500/10 border border-red-500/30 text-red-400 rounded-lg px-4 py-3 mb-5 text-sm">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/add" class="space-y-5">

    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1.5">Person <span class="text-red-400">*</span></label>
      <div class="flex gap-2">
        <select name="person_id" required
          class="flex-1 bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
          <option value="">Select a person…</option>
          {% for p in persons %}
          <option value="{{ p.id }}">{{ p.name }}{% if p.handle %} (@{{ p.handle }}){% endif %}</option>
          {% endfor %}
        </select>
        <a href="/add-person" class="text-sm bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-2.5 rounded-lg border border-gray-700 whitespace-nowrap transition-colors">
          + New
        </a>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1.5">Prediction <span class="text-red-400">*</span></label>
      <textarea name="text" required rows="4" placeholder="Quote their prediction verbatim…"
        class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 resize-none placeholder-gray-600"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1.5">Source Type <span class="text-red-400">*</span></label>
        <select name="source_type"
          class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
          {% for st in source_types %}
          <option value="{{ st }}">{{ st | capitalize }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1.5">Source URL <span class="text-gray-500 font-normal">(optional)</span></label>
        <input type="url" name="source_url" placeholder="https://…"
          class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-600" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1.5">Source Description <span class="text-gray-500 font-normal">(optional)</span></label>
      <input type="text" name="source_description" placeholder="e.g. CNBC interview, Jan 2020"
        class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-600" />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1.5">Date Made <span class="text-red-400">*</span></label>
        <input type="date" name="made_at" required
          class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1.5">Deadline <span class="text-gray-500 font-normal">(optional)</span></label>
        <input type="date" name="deadline"
          class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500" />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1.5">Category</label>
        <select name="category"
          class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
          {% for cat in categories %}
          <option value="{{ cat }}">{{ cat | capitalize }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1.5">Stated Confidence % <span class="text-gray-500 font-normal">(optional)</span></label>
        <input type="number" name="confidence_pct" min="0" max="100" step="1" placeholder="e.g. 80"
          class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-600" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1.5">Polymarket / Kalshi URL <span class="text-gray-500 font-normal">(optional)</span></label>
      <input type="url" name="market_url" placeholder="https://polymarket.com/event/…"
        class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-600" />
    </div>

    <div class="pt-2">
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-lg font-semibold text-sm transition-colors">
        Save Prediction
      </button>
      <a href="/" class="ml-3 text-sm text-gray-400 hover:text-white transition-colors">Cancel</a>
    </div>

  </form>
</div>

{% endblock %}
