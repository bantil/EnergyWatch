{% extends "base.html" %}
{% block title %}Add Person — Receipts{% endblock %}

{% block content %}

<div class="max-w-lg">
  <h1 class="text-2xl font-bold text-white mb-6">Add a Person</h1>

  {% if error %}
  <div class="bg-red-500/10 border border-red-500/30 text-red-400 rounded-lg px-4 py-3 mb-5 text-sm">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/add-person" class="space-y-5">

    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1.5">Name <span class="text-red-400">*</span></label>
      <input type="text" name="name" required placeholder="e.g. Nouriel Roubini"
        class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-600" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1.5">Twitter / X Handle <span class="text-gray-500 font-normal">(optional, without @)</span></label>
      <input type="text" name="handle" placeholder="e.g. Nouriel"
        class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 placeholder-gray-600" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1.5">Category</label>
      <select name="category"
        class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
        {% for cat in person_categories %}
        <option value="{{ cat }}">{{ cat | capitalize }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1.5">Description <span class="text-gray-500 font-normal">(optional)</span></label>
      <textarea name="description" rows="3" placeholder="Brief bio or context…"
        class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 resize-none placeholder-gray-600"></textarea>
    </div>

    <div class="pt-2">
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-lg font-semibold text-sm transition-colors">
        Add Person
      </button>
      <a href="/" class="ml-3 text-sm text-gray-400 hover:text-white transition-colors">Cancel</a>
    </div>

  </form>
</div>

{% endblock %}
